<!DOCTYPE html>

<html class="dark" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                    "error": "#ff716c",
                    "tertiary": "#faf9f9",
                    "on-surface": "#ffffff",
                    "outline-variant": "#484847",
                    "inverse-primary": "#006e35",
                    "inverse-on-surface": "#565555",
                    "surface-container-highest": "#262626",
                    "surface-container-high": "#20201f",
                    "on-secondary-fixed": "#70000d",

                    "tertiary-fixed": "#ffffff",
                    "error-dim": "#d7383b",
                    "error-container": "#9f0519",
                    "secondary-fixed": "#ffc3bf",
                    "on-error": "#490006",
                    "on-primary-fixed": "#004820",
                    "tertiary-fixed-dim": "#f1f0f0",

            "borderRadius": {

            "fontFamily": {
                    "headline": ["Inter"],
                    "body": ["Inter"],
                    "label": ["Inter"]
            }
          },
        },
      }

<style>
        body { background-color: #0e0e0e; color: #ffffff; font-family: 'Inter', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .bg-tactile-gradient { background: linear-gradient(135deg, #3fff8b 0%, #13ea79 100%); }
    </style>
</head>
<body class="antialiased overflow-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 w-full bg-transparent backdrop-blur-xl z-50 flex justify-between items-center px-8 py-6 w-full">
<div class="text-xl font-black tracking-widest text-[#3fff8b] font-['Inter'] font-extrabold tracking-tighter">
            MONOLITHIC
        </div>
<div class="flex items-center gap-6">
<button class="text-zinc-500 hover:text-white transition-colors duration-300 scale-95 active:duration-100">
<span class="material-symbols-outlined" data-icon="history">history</span>
</button>
<button class="text-zinc-500 hover:text-white transition-colors duration-300 scale-95 active:duration-100">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</div>
</header>
<!-- SideNavBar (Hidden on Mobile) -->
<nav class="hidden md:flex fixed inset-y-0 left-0 z-50 flex flex-col p-6 h-full w-72 bg-zinc-900/70 backdrop-blur-2xl shadow-2xl shadow-black/50">
<div class="mb-12 mt-8">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-full overflow-hidden bg-surface-container">
<img alt="User Profile" data-alt="close-up portrait of a user profile avatar in a dark minimalist aesthetic" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDq2tHAznPjHp1hZkmqukYg-q4euVnJpDXBEnLZ1PlTpIjtcsHq6favWhlY8MANNa9gM-8UpkMzzEuz1lUEl6yvUotWzvgnK73SP5-t-bjtnuhBBG4dlJOFwZjFiL_kE7PAUm2NCgIl0hZJe7QkFC0UlO1--xHr7PHhbBDDE9ARfB1FRB2DlH3yWjUf2x7wNErdy7h9k7HyakkvfftoAIHvE9oLM53NY5H5x_T8jAo1hfiO8kj35d0BDvngLaIkk9CbO9Jra_exULh4"/>
</div>
<div>
<h2 class="text-white text-lg font-extrabold">The Void</h2>
<p class="font-['Inter'] font-medium uppercase tracking-[0.1em] text-[10px] text-zinc-500">Tactile Instrument</p>
</div>
</div>
</div>
<div class="flex flex-col gap-2">
<a class="flex items-center gap-4 px-4 py-3 rounded-xl text-[#3fff8b] font-bold font-['Inter'] font-medium uppercase tracking-[0.1em] text-[10px] bg-zinc-800/50" href="#">
<span class="material-symbols-outlined" data-icon="add_circle">add_circle</span>
                Counter
            </a>
<a class="flex items-center gap-4 px-4 py-3 rounded-xl text-zinc-500 hover:bg-zinc-800/50 hover:text-white transition-all font-['Inter'] font-medium uppercase tracking-[0.1em] text-[10px]" href="#">
<span class="material-symbols-outlined" data-icon="history">history</span>
                History
            </a>
<a class="flex items-center gap-4 px-4 py-3 rounded-xl text-zinc-500 hover:bg-zinc-800/50 hover:text-white transition-all font-['Inter'] font-medium uppercase tracking-[0.1em] text-[10px]" href="#">
<span class="material-symbols-outlined" data-icon="emoji_events">emoji_events</span>
                Milestones
            </a>
<a class="flex items-center gap-4 px-4 py-3 rounded-xl text-zinc-500 hover:bg-zinc-800/50 hover:text-white transition-all font-['Inter'] font-medium uppercase tracking-[0.1em] text-[10px]" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
                Settings
            </a>
</div>
<div class="mt-auto p-4 rounded-2xl bg-surface-container-low">
<p class="text-[10px] text-on-surface-variant uppercase tracking-widest mb-2">Sistem Durumu</p>
<div class="h-1 w-full bg-zinc-800 rounded-full overflow-hidden">
<div class="h-full bg-primary w-2/3"></div>
</div>
</div>
</nav>
<!-- Main Canvas -->
<main class="relative min-h-screen flex flex-col items-center justify-center px-6 md:ml-72 bg-surface">
<!-- Background Ambient Glow -->
<div class="absolute inset-0 overflow-hidden pointer-events-none">
<div class="absolute -top-24 -left-24 w-96 h-96 bg-primary/10 blur-[120px] rounded-full"></div>
<div class="absolute bottom-1/4 -right-24 w-64 h-64 bg-secondary/5 blur-[100px] rounded-full"></div>
</div>
<!-- The Hero Counter -->
<div class="relative z-10 flex flex-col items-center">
<div class="text-on-surface-variant font-['Inter'] font-bold text-[11px] tracking-widest uppercase mb-4 opacity-50">
                Aktif Sayım
            </div>
<div class="text-[12rem] md:text-[16rem] font-black tracking-tighter text-primary leading-none select-none drop-shadow-[0_0_80px_rgba(63,255,139,0.2)]">
                42
            </div>
<!-- Contextual Info -->
<div class="flex gap-8 mt-12">
<div class="flex flex-col items-center">
<span class="text-xs text-on-surface-variant uppercase tracking-widest">Hedef</span>
<span class="text-xl font-bold text-white">100</span>
</div>
<div class="w-[1px] h-10 bg-surface-container-highest"></div>
<div class="flex flex-col items-center">
<span class="text-xs text-on-surface-variant uppercase tracking-widest">Hız</span>
<span class="text-xl font-bold text-white">1.2/s</span>
</div>
</div>
</div>
<!-- Floating Reset Action (The Utility) -->
<div class="absolute top-1/2 right-12 -translate-y-1/2 hidden lg:flex flex-col items-center gap-4">
<button class="group flex flex-col items-center gap-2">
<div class="w-12 h-12 rounded-full border border-outline-variant/30 flex items-center justify-center hover:bg-surface-container-highest transition-all duration-300">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-white" data-icon="refresh">refresh</span>
</div>
<span class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant">Sıfırla</span>
</button>
</div>
</main>
<!-- BottomNavBar (Mobile Only & Primary Interaction) -->
<nav class="fixed bottom-0 w-full z-50 flex justify-around items-center px-6 pb-10 pt-6 bg-zinc-900/80 backdrop-blur-2xl rounded-t-[32px] shadow-[0_-24px_48px_rgba(0,0,0,0.5)] md:px-32 md:pb-8">
<!-- Decrement Action -->
<button class="flex flex-col items-center justify-center text-zinc-400 p-3 hover:bg-zinc-800 transition-all scale-95 active:scale-90 transition-transform duration-200">
<div class="w-14 h-14 rounded-2xl bg-secondary-container flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-secondary text-3xl" data-icon="remove">remove</span>
</div>
<span class="font-['Inter'] font-bold text-[11px] tracking-widest uppercase">Azalt</span>
</button>
<!-- Primary Increment (The Command Center) -->
<button class="flex flex-col items-center justify-center bg-tactile-gradient text-black rounded-3xl p-6 -mt-16 shadow-[0_12px_40px_rgba(63,255,139,0.4)] scale-100 active:scale-90 transition-all duration-200">
<span class="material-symbols-outlined text-5xl font-bold" data-icon="add">add</span>
<span class="font-['Inter'] font-black text-[12px] tracking-widest uppercase mt-1">Artır</span>
</button>
<!-- Reset/Action (The Utility) -->
<button class="flex flex-col items-center justify-center text-zinc-400 p-3 hover:bg-zinc-800 transition-all scale-95 active:scale-90 transition-transform duration-200">
<div class="w-14 h-14 rounded-2xl bg-surface-container-high flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-on-surface text-3xl" data-icon="refresh">refresh</span>
</div>
<span class="font-['Inter'] font-bold text-[11px] tracking-widest uppercase">Sıfırla</span>
</button>
</nav>
<!-- Decorative Canvas Elements (Bento style grid hints) -->
<div class="fixed top-32 right-8 w-48 h-48 border border-white/5 rounded-3xl -z-10 rotate-12 md:block hidden"></div>
<div class="fixed bottom-40 left-80 w-32 h-32 border border-white/5 rounded-full -z-10 md:block hidden"></div>
</body></html>
